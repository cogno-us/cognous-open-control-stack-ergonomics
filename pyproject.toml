[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cognous-ocs"
version = "0.1.0"
description = "Front door to the Cognous Open Control Stack: offline demo, evidence render, checks. It relays component verdicts and decides nothing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Cognous" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# The four components, at the revisions listed in the hub's component-lock.json (see docs/demo.md;
# the pins are recorded in
# src/cognous_ocs/fixtures/customer-service/provenance.json). Direct
# references: this extra is for installing from this repository, not for an
# index upload. Nothing is published from this repository.
stack = [
    "agent-action-manifest @ git+https://github.com/cogno-us/cognous-action-manifest@ff5490828b2bf7f6a976da209f3f533701855687",
    "agent-control-plane @ git+https://github.com/cogno-us/cognous-control-plane@2bac7875391cad0a431fa0d75208b7ade39743e3",
    "agent-replay-bundle @ git+https://github.com/cogno-us/cognous-replay-bundle@6a6a477495ac24e813f12bb0fe314acfe8bac9cf",
    "agent-governance-evidence-pack @ git+https://github.com/cogno-us/cognous-governance-evidence-pack@fd030615a782a064b89c57e8e40d7f220f99ff9e",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "mypy>=1.10",
    "ruff>=0.5",
    "build>=1.2",
    "jsonschema>=4.20",
    "types-jsonschema>=4.20",
    "pyyaml>=6",
    "types-pyyaml>=6",
    "hatchling>=1.25",
]

# The only installed command is `cognous-ocs` (no `ocs` script: that name is probably taken).
[project.scripts]
cognous-ocs = "cognous_ocs.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cognous_ocs"]

# The frozen schema snapshots ship as package data under cognous_ocs/schema_resources/.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "cognous_ocs/schema_resources"

[tool.hatch.build.targets.sdist]
include = ["src/cognous_ocs", "tests", "docs", "scripts", ".githooks", "Makefile", "release-state.json", "schemas", "examples", "requirements", ".github/actions", ".gitattributes", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --strict-markers --strict-config --cov=cognous_ocs --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["error"]
markers = ["integration: runs the real pinned component commands (needs the stack extra)"]

[tool.coverage.run]
branch = true

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts", ".github/actions/ocs"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607", "E501"]
# The rename to `cognous-ocs` lengthened docstring and message lines in these files.
"src/cognous_ocs/ci.py" = ["E501"]
"src/cognous_ocs/doctor.py" = ["E501"]
"src/cognous_ocs/envelope.py" = ["E501"]
"src/cognous_ocs/passthrough.py" = ["E501"]
"src/cognous_ocs/registry.py" = ["E501"]
"src/cognous_ocs/schemas.py" = ["E501"]
"src/cognous_ocs/validate.py" = ["E501"]
"src/cognous_ocs/demo.py" = ["S603", "E501"]
"src/cognous_ocs/render.py" = ["E501"]
"src/cognous_ocs/dashboard.py" = ["E501"]
"scripts/*" = ["E501", "S101", "S603", "S607", "SIM", "RUF", "E402"]
".github/actions/ocs/*" = ["E501", "S101"]
"tools/*" = ["E501", "E741", "S603", "S607", "SIM", "B", "RUF"]
