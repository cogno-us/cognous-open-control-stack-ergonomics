name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The runner image is pinned: `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19. Move this label
# deliberately, in its own change. Third-party actions are pinned by commit SHA with the release
# tag in a comment (cli-contract section 9); each pinned release runs on Node 24.
jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      OCS_REQUIRE_STACK: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (components are pinned to the hub component-lock commits)
        run: python -m pip install -e ".[dev,stack]"
      - name: make check (lint, types, lock, tests with sockets off, docs, claims, examples, build)
        run: make check

  acceptance:
    # Clean venv, install the built wheel with the pinned stack, run the demo with the network
    # namespace removed, require exit 0 and a blocked send in the HTML, within two minutes.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install -e ".[dev]"
      - name: Build, check wheel contents, clean-venv smoke test (demo under unshare -n)
        run: make build wheel-check smoke

  publish-gate-holds:
    # Passing gates never authorizes publication: while release-state.json says publication is
    # not authorized, the whole publish check must fail, and fail at the authorization gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OCS_REQUIRE_STACK: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,stack]"
      - name: make release-publish-check must fail on HOLD
        run: |
          set +e
          make release-publish-check > "$RUNNER_TEMP/publish-check.log" 2>&1
          status=$?
          tail -n 12 "$RUNNER_TEMP/publish-check.log"
          if [ "$status" -eq 0 ]; then echo "publish check passed while publication is not authorized"; exit 1; fi
          grep -q "passing gates never authorizes publication" "$RUNNER_TEMP/publish-check.log"
