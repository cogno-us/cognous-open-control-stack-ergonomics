name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      OCS_REQUIRE_STACK: "1"
    steps:
      # Third-party actions are pinned by commit SHA (cli-contract section 9).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (components are pinned to the hub component-lock commits)
        run: python -m pip install -e ".[dev,stack]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy
      - name: Tests (sockets disabled in-process, coverage floor 80%)
        run: pytest -q

  acceptance:
    # Clean venv, install the built wheel with the pinned stack, run the demo with the network
    # namespace removed, require exit 0 and a blocked send in the HTML, within two minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel and install into a clean venv
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install "$(ls "$RUNNER_TEMP"/dist/*.whl)[stack]"
      - name: Demo with the network removed (exit 0 in under two minutes)
        run: |
          set -o pipefail
          start=$(date +%s)
          sudo env RUNNER_TEMP="$RUNNER_TEMP" unshare -n -- timeout 120 "$RUNNER_TEMP/v/bin/ocs" demo customer-service --out "$RUNNER_TEMP/demo"
          echo "elapsed: $(( $(date +%s) - start ))s"
          grep -q 'chip blocked">blocked</span> <code>email_send</code>' "$RUNNER_TEMP/demo/evidence.html"
